<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Message</title>
<icon><form action="instagram.png"></form></icon>
<style>
  /* Reset */
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#000;
    color:#0f0; /* neon green */
    font-family: 'Courier New', monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
  }

  .terminal {
    background: rgba(0,0,0,0.85);
    border: 2px solid #0f0;
    border-radius:8px;
    padding:24px;
    width:90%;
    max-width:700px;
    position:relative;
    box-shadow: 0 0 20px #0f0;
  }

  .line {
    white-space: pre-wrap;
    font-size:18px;
    line-height:1.4;
    margin-bottom:8px;
  }

  .cursor {
    display:inline-block;
    width:12px;
    background:#0f0;
    animation: blink 1s steps(2, start) infinite;
    vertical-align:bottom;
  }

  @keyframes blink { 50% { opacity:0 } }

  /* particles */
  .particle {
    position:absolute;
    width:4px; height:4px;
    background:#0f0;
    opacity:0.6;
    border-radius:50%;
    animation: floatUp 5s linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.3); opacity:0.2 }
    50% { opacity:0.8 }
    100% { transform: translateY(-50px) scale(0.6); opacity:0 }
  }

  .signature {
    margin-top:16px;
    color:rgb(74, 255, 2);
    font-size:14px;
    text-align:right;
    font-style:italic;
  }
</style>
</head>
<body>
  <div class="terminal" aria-label="Black Box Love Message">
    <div class="line" id="line1"></div>
    <div class="line" id="line2"></div>
    <div class="line" id="line3"></div>
    <div class="line" id="line4"></div>
    <div class="signature">Made with ❤️ by Younes Dev Oujda</div>
  </div>

<script>
  const messages = [
    "Initializing love.exe ...",
    "Loading feelings... ██████████ 100%",
    'Sending message: "From Younes to You ❤️"',
    "Connection established.\nLove transmission successful 💌"
  ];

  let i = 0;
  let j = 0;

  function typeLine(lineId, text, callback){
    const el = document.getElementById(lineId);
    el.textContent = "";
    let k = 0;
    function step(){
      if(k < text.length){
        el.textContent += text[k++];
        setTimeout(step, 60 + Math.random()*50);
      } else if(callback) callback();
    }
    step();
  }

  function startTyping(){
    if(i >= messages.length) return;
    const lineId = "line"+(i+1);
    typeLine(lineId, messages[i], ()=>{
      i++;
      startTyping();
    });
  }

  startTyping();

  // particles background
  const particleCount = 50;
  for(let p=0;p<particleCount;p++){
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random()*100 + 'vw';
    particle.style.animationDelay = Math.random()*5 + 's';
    particle.style.width = particle.style.height = (2 + Math.random()*4) + 'px';
    document.body.appendChild(particle);
  }

  // blinking cursor after last line
  const lastLine = document.getElementById('line4');
  const cursor = document.createElement('span');
  cursor.className='cursor';
  lastLine.appendChild(cursor);
</script>
</body>
</html>

</html>
